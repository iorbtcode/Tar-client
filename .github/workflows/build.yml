name: Build

# builds on every push. to make a release either push a tag like v1.0.0,
# or go to Actions > Build > Run workflow and type a version
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (like v1.0.0), leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/TarClient.dll, build/Release/TarClientJava.dll, build/Release/TarInjector.exe, README.md, MODULES.txt dist/
          Compress-Archive -Path dist/* -DestinationPath TarClient.zip -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TarClient
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Tar Client ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            TarClient.zip
            dist/TarClient.dll
            dist/TarClientJava.dll
            dist/TarInjector.exe
